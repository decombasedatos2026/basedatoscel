<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />

  <title>IPUC · Miembros (PWA)</title>

  <style>
    :root{
      --bg:#0b1020;--card:#121a33;--muted:#9aa4c0;--text:#e9ecf6;
      --accent:#4c7dff;--border:rgba(255,255,255,.08);--ok:#2dd4bf;--danger:#ff4c6a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(76,125,255,0.25), transparent 60%),
        radial-gradient(1000px 500px at 90% 30%, rgba(45,212,191,0.18), transparent 60%),
        var(--bg);
    }
    .header{position:sticky;top:0;backdrop-filter:blur(12px);background:rgba(11,16,32,.75);border-bottom:1px solid var(--border);z-index:5}
    .header-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px;flex-wrap:wrap}
    .brand{display:flex;flex-direction:column;gap:2px}
    .brand .title{font-weight:900;letter-spacing:.2px}
    .small{font-size:12px;color:var(--muted)}
    .container{max-width:1200px;margin:0 auto;padding:16px}
    .card{
      background:rgba(18,26,51,.9);border:1px solid var(--border);border-radius:16px;
      padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.25)
    }
    hr.sep{border:0;border-top:1px solid var(--border);margin:14px 0}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .col{flex:1;min-width:240px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
    input, textarea, select, button {
      width:100%;
      padding:12px 14px;
      font-size:14px;
      background:rgba(0,0,0,.25);
      color:var(--text);
      border:1px solid var(--border);
      border-radius:14px;
      outline:none;
    }
    textarea{min-height:140px;resize:vertical}
    .btn{
      width:auto;
      padding:10px 14px;border-radius:12px;border:1px solid var(--border);
      background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;
      font-weight:700;
    }
    .btn:hover{background:rgba(255,255,255,.10)}
    .btn.primary{
      background: linear-gradient(180deg, #4c7dff, #3c68e0);
      border: none;color:#fff;box-shadow: 0 6px 18px rgba(76,125,255,.25);
    }
    .btn.primary:hover{ background: linear-gradient(180deg, #5a88ff, #4c7dff); }
    .btn.danger{
      background: rgba(255,76,106,.08);
      border: 1px solid rgba(255,76,106,.35);
      color: #ff8fa3;
    }
    .btn.danger:hover{background: rgba(255,76,106,.14); color:#ffd1da;}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .badge{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--muted)}
    .panel{background:rgba(0,0,0,.15);border:1px solid var(--border);border-radius:16px;padding:14px}
    .searchbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .searchbar input{flex:1;min-width:220px}
    .suggestions{
      position:absolute;left:0;right:0;top:calc(100% + 8px);
      border:1px solid var(--border);border-radius:14px;background:rgba(0,0,0,.92);
      display:none;z-index:9999;max-height:280px;overflow:auto;box-shadow:0 18px 45px rgba(0,0,0,.45);
    }
    .suggestions .item{
      padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--border);
    }
    .suggestions .item:first-child{border-top:none}
    .suggestions .item:hover{background:rgba(255,255,255,.06)}
    .muted{color:var(--muted)}
    .toast-container{
      position: fixed;top: 16px;left: 50%;transform: translateX(-50%);
      z-index: 99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;
    }
    .toast{
      pointer-events:auto;
      background: rgba(18,26,51,.95);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      min-width: 260px;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      font-size: 14px;
    }
    .toast.success{border-left:4px solid var(--ok)}
    .toast.error{border-left:4px solid var(--danger)}
    .toast.info{border-left:4px solid var(--accent)}
    .top-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .authbox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .avatar{
      width:34px;height:34px;border-radius:999px;border:1px solid var(--border);
      display:inline-flex;align-items:center;justify-content:center;
      background:rgba(255,255,255,.06);
      font-weight:900;
    }
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width: 980px){ .grid2{grid-template-columns:1fr} }
    :root{ color-scheme: dark; }
  </style>

  <!-- Supabase JS (UMD correcto para navegador) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

</head>

<body>
  <div class="toast-container" id="toastContainer"></div>

  <div class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="title">IPUC · Miembros</div>
        <div class="small">PWA · Búsqueda + Registro</div>
      </div>

      <div class="authbox">
        <span class="badge" id="authBadge">Sin sesión</span>
        <div class="avatar" id="avatar" title="Cuenta">G</div>
        <button class="btn" id="btnLogin">Iniciar sesión</button>
        <button class="btn danger" id="btnLogout" style="display:none;">Cerrar sesión</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card">

      <div class="row" style="align-items:center;justify-content:space-between;">
        <div>
          <h3 style="margin:0;">Módulo: Miembros</h3>
          <div class="small">Selecciona desde la búsqueda para ver/editar. Nuevo para crear.</div>
        </div>

        <div class="top-actions">
          <button class="btn" id="btnNew">+ Nuevo</button>
          <button class="btn primary" id="btnSave">Guardar</button>
          <button class="btn danger" id="btnDelete">Eliminar</button>
        </div>
      </div>

      <hr class="sep" />

      <!-- Buscador -->
      <div class="panel" style="position:relative;">
        <label>Buscador (Nombre/Apellido o Identificación)</label>
        <div class="searchbar">
          <input id="searchBox" placeholder="Ej: Juan Pérez o 123456789" />
          <button class="btn primary" id="btnSearch">Buscar</button>
          <button class="btn" id="btnClearSearch">Limpiar</button>
        </div>
        <div class="suggestions" id="suggestions"></div>
        <div class="hint small muted" style="margin-top:10px;">
          * Solo usuarios autorizados pueden guardar/eliminar. El resto puede ver.
        </div>
      </div>

      <hr class="sep" />

      <!-- Formulario -->
      <div class="panel">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <div class="badge" id="statusBadge">Listo</div>
          <div class="badge">ID seleccionado: <b id="selectedIdLabel">—</b></div>
        </div>

        <hr class="sep" />

        <div class="grid2">
          <div>
            <label>Nombres *</label>
            <input id="first_names" />
          </div>
          <div>
            <label>Apellidos *</label>
            <input id="last_names" />
          </div>
        </div>

        <div class="grid2" style="margin-top:10px;">
          <div>
            <label>Identificación *</label>
            <input id="identification" />
          </div>
          <div>
            <label>Edad *</label>
            <input id="age" type="number" min="0" />
          </div>
        </div>

        <div class="grid2" style="margin-top:10px;">
          <div>
            <label>Género *</label>
            <select id="gender">
              <option value="">-- Seleccionar --</option>
              <option value="Masculino">Masculino</option>
              <option value="Femenino">Femenino</option>
            </select>
          </div>
          <div>
            <label>Cargo en la iglesia</label>
            <input id="church_role" />
          </div>
        </div>

        <div class="grid2" style="margin-top:10px;">
          <div>
            <label>Dirección</label>
            <input id="address" />
          </div>
          <div>
            <label>Ciudad</label>
            <input id="city" />
          </div>
        </div>

        <div class="grid2" style="margin-top:10px;">
          <div>
            <label>Fecha de nacimiento</label>
            <input id="birth_date" type="date" />
          </div>
          <div>
            <label>Simpatizante</label>
            <select id="is_sympathizer">
              <option value="false">No</option>
              <option value="true">Sí</option>
            </select>
          </div>
        </div>

        <div style="margin-top:10px;">
          <label>Observaciones</label>
          <textarea id="observations" placeholder="Notas adicionales..."></textarea>
        </div>

      </div>
    </div>
  </div>

  <script>


    // ✅ Captura errores JS y los muestra como toast (para no quedar "en silencio")
window.addEventListener("error", (e) => {
  const msg = (e?.message || e?.error?.message || "Error desconocido");
  const where = (e?.filename ? `\n${e.filename}:${e.lineno}:${e.colno}` : "");
  try { toast("❌ JS: " + msg + where, "error", 9000); } catch {}
  console.log("JS ERROR:", e);
});

window.addEventListener("unhandledrejection", (e) => {
  const msg = (e?.reason?.message || String(e?.reason || "Promise error"));
  try { toast("❌ Promise: " + msg, "error", 9000); } catch {}
  console.log("UNHANDLED:", e);
});

    // =========================
    // 1) CONFIGURA TUS KEYS
    // =========================
    const SUPABASE_URL = "https://ggznwqocjvfawjmbtzda.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_sXfYr31mrDcwkgPDY9pWsQ_C6x1yRhc";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


console.log("Supabase loaded?", !!window.supabase, window.supabase?.createClient ? "OK" : "NO");
toast("Supabase: " + (window.supabase?.createClient ? "OK" : "NO"), window.supabase?.createClient ? "success" : "error", 4000);

    

    // =========================
    // 2) ESTADO
    // =========================
    const state = {
      user: null,
      authed: false,
      allowed: false,
      selectedId: null,
      memberDraft: blankMember(),
      results: []
    };

    // =========================
    // 3) UI HELPERS
    // =========================
    const $ = (id) => document.getElementById(id);

    function toast(msg, type="info", ms=3500){
      const c = $("toastContainer");
      const node = document.createElement("div");
      node.className = "toast " + type;
      node.textContent = msg;
      c.appendChild(node);
      setTimeout(() => { try{ node.remove(); }catch{} }, ms);
    }

    function setStatus(text){
      $("statusBadge").textContent = text;
    }

    function setSelectedId(id){
      state.selectedId = id || null;
      $("selectedIdLabel").textContent = state.selectedId ? String(state.selectedId) : "—";
    }

    function blankMember(){
      return {
        first_names: "",
        last_names: "",
        identification: "",
        age: "",
        gender: "",
        church_role: "",
        address: "",
        city: "",
        birth_date: "",
        is_sympathizer: false,
        observations: ""
      };
    }

    function fillForm(m){
      $("first_names").value = m.first_names || "";
      $("last_names").value = m.last_names || "";
      $("identification").value = m.identification || "";
      $("age").value = (m.age ?? "") === null ? "" : (m.age ?? "");
      $("gender").value = m.gender || "";
      $("church_role").value = m.church_role || "";
      $("address").value = m.address || "";
      $("city").value = m.city || "";
      $("birth_date").value = m.birth_date || "";
      $("is_sympathizer").value = String(!!m.is_sympathizer);
      $("observations").value = m.observations || "";
    }

    function readForm(){
      return {
        first_names: $("first_names").value.trim(),
        last_names: $("last_names").value.trim(),
        identification: $("identification").value.trim(),
        age: (() => {
          const raw = ($("age").value || "").trim();
          return raw === "" ? null : Number(raw);
        })(),
        gender: $("gender").value || null,
        church_role: ($("church_role").value || "").trim() || null,
        address: ($("address").value || "").trim() || null,
        city: ($("city").value || "").trim() || null,
        birth_date: $("birth_date").value || null,
        is_sympathizer: $("is_sympathizer").value === "true",
        observations: ($("observations").value || "").trim() || null
      };
    }

    function setWriteEnabled(enabled){
      $("btnSave").disabled = !enabled;
      $("btnDelete").disabled = !enabled;
    }

    // =========================
    // 4) AUTH + allowed_emails
    // =========================
    function paintAuth(){
      if (state.user){
        $("authBadge").textContent = state.user.email || "Sesión iniciada";
        $("btnLogin").style.display = "none";
        $("btnLogout").style.display = "";
        $("avatar").textContent = (state.user.email || "G").trim()[0]?.toUpperCase() || "G";
      } else {
        $("authBadge").textContent = "Sin sesión";
        $("btnLogin").style.display = "";
        $("btnLogout").style.display = "none";
        $("avatar").textContent = "G";
      }

      // Solo habilitar escritura si: logueado + allowed
      setWriteEnabled(!!state.user && !!state.allowed);
    }

    async function checkAllowed(){
      state.allowed = false;

      if (!state.user?.email) return;

      // 1) leer allowed_emails con RLS/policy (RECOMENDADO)
      // si no tienes policy de SELECT, esto fallará y te dará false.
      const email = String(state.user.email).toLowerCase();

      const { data, error } = await supabase
        .from("allowed_emails")
        .select("email")
        .eq("email", email)
        .maybeSingle();

      if (error) {
        console.log("allowed_emails read error:", error);
        state.allowed = false;
        return;
      }

      state.allowed = !!data?.email;
    }

    async function refreshSession(){
      const { data } = await supabase.auth.getSession();
      state.user = data?.session?.user || null;

      if (state.user){
        await checkAllowed();
        if (!state.allowed){
          toast("⚠️ Tu correo no está autorizado para editar. Solo podrás ver.", "info", 5000);
        }
      } else {
        state.allowed = false;
      }

      paintAuth();
    }

    $("btnLogin").addEventListener("click", async () => {
      try{
        // OAuth redirect funciona bien en móvil
        const { error } = await supabase.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo: window.location.origin + window.location.pathname
          }
        });
        if (error) throw error;
      } catch(e){
        toast("❌ No se pudo iniciar sesión: " + (e?.message || e), "error");
      }
    });

    $("btnLogout").addEventListener("click", async () => {
      await supabase.auth.signOut();
      state.user = null;
      state.allowed = false;
      paintAuth();
      toast("✅ Sesión cerrada.", "success");
    });

    supabase.auth.onAuthStateChange(async () => {
      await refreshSession();
    });

    // =========================
    // 5) SEARCH + SUGGESTIONS
    // =========================
    function renderSuggestions(items){
      const box = $("suggestions");
      if (!items || items.length === 0){
        box.style.display = "none";
        box.innerHTML = "";
        return;
      }
      box.style.display = "block";
      box.innerHTML = "";

      items.forEach((m) => {
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `
          <div>
            <div style="font-weight:800;">${(m.first_names||"")} ${(m.last_names||"")}</div>
            <div class="small">Doc: ${(m.identification||"")} · Ciudad: ${(m.city||"")}</div>
          </div>
          <div class="small muted">Seleccionar</div>
        `;

        // ✅ FIX Windows/móvil: seleccionar en pointerdown (antes del blur)
        const onPick = (ev) => {
          ev.preventDefault();
          ev.stopPropagation();

          state.memberDraft = { ...m };
          fillForm(state.memberDraft);
          setSelectedId(m.id);

          renderSuggestions([]);
          setStatus("Cargado (seleccionado)");
          toast("✅ Miembro cargado.", "success");
        };

        item.addEventListener("pointerdown", onPick);
        item.addEventListener("mousedown", onPick);

        box.appendChild(item);
      });
    }

    // Evita que el blur mate el click en sugerencias
    $("suggestions").addEventListener("pointerdown", (e) => e.preventDefault());
    $("suggestions").addEventListener("mousedown", (e) => e.preventDefault());

    function debounce(fn, wait=350){
      let t=null;
      return (...args) => {
        clearTimeout(t);
        t=setTimeout(() => fn(...args), wait);
      };
    }

    async function searchMembers(q){
      const query = String(q || "").trim();
      if (!query) return [];

      const like = `%${query}%`;

      const { data, error } = await supabase
        .from("members")
        .select("*")
        .or(`identification.ilike.${like},first_names.ilike.${like},last_names.ilike.${like}`)
        .order("created_at", { ascending: false })
        .limit(20);

      if (error) throw error;
      return data || [];
    }

    const autoSearch = debounce(async () => {
      try{
        const q = ($("searchBox").value || "").trim();
        if (!q || q.length < 2){
          renderSuggestions([]);
          return;
        }
        const items = await searchMembers(q);
        renderSuggestions(items);
      } catch(e){
        console.log(e);
      }
    }, 300);

    $("searchBox").addEventListener("input", autoSearch);
    $("searchBox").addEventListener("keydown", (e) => {
      if (e.key === "Enter") $("btnSearch").click();
      if (e.key === "Escape") renderSuggestions([]);
    });
    $("searchBox").addEventListener("blur", () => {
      setTimeout(() => renderSuggestions([]), 150);
    });

    $("btnSearch").addEventListener("click", async () => {
      try{
        const q = ($("searchBox").value || "").trim();
        const items = await searchMembers(q);
        renderSuggestions(items);
      } catch(e){
        toast("❌ Error buscando: " + (e?.message || e), "error");
      }
    });

    $("btnClearSearch").addEventListener("click", () => {
      $("searchBox").value = "";
      renderSuggestions([]);
      $("searchBox").focus();
    });

    // =========================
    // 6) CRUD
    // =========================
    $("btnNew").addEventListener("click", () => {
      state.memberDraft = blankMember();
      fillForm(state.memberDraft);
      setSelectedId(null);
      setStatus("Nuevo");
    });

    $("btnSave").addEventListener("click", async () => {
      try{
        if (!state.user) {
          toast("⚠️ Debes iniciar sesión.", "info");
          return;
        }
        if (!state.allowed) {
          toast("⛔ Tu correo no está autorizado para guardar.", "error");
          return;
        }

        const m = readForm();

        if (!m.first_names || !m.last_names || !m.identification){
          toast("⚠️ Nombres, apellidos e identificación son obligatorios.", "info");
          return;
        }

        const ageNum = Number(m.age);
        if (m.age === null || !Number.isFinite(ageNum) || ageNum < 0){
          toast("⚠️ La edad es obligatoria y válida (>= 0).", "info");
          return;
        }
        if (!m.gender){
          toast("⚠️ El género es obligatorio.", "info");
          return;
        }

        setStatus("Guardando...");

        if (state.selectedId){
          const { data, error } = await supabase
            .from("members")
            .update(m)
            .eq("id", state.selectedId)
            .select("*")
            .single();

          if (error) throw error;

          state.memberDraft = { ...data };
          fillForm(state.memberDraft);
          setStatus("Guardado (actualizado)");
          toast("✅ Cambios guardados.", "success");
        } else {
          const { data, error } = await supabase
            .from("members")
            .insert(m)
            .select("*")
            .single();

          if (error) throw error;

          state.memberDraft = { ...data };
          fillForm(state.memberDraft);
          setSelectedId(data.id);
          setStatus("Guardado (nuevo)");
          toast("✅ Guardado correctamente.", "success");
        }
      } catch(e){
        console.log(e);
        const msg = e?.message || String(e);
        const raw = msg.toLowerCase();
        const esDuplicado =
          raw.includes("duplicate key") ||
          raw.includes("unique constraint") ||
          raw.includes("violates unique") ||
          raw.includes("23505") ||
          raw.includes("already exists") ||
          raw.includes("ya existe");

        if (esDuplicado){
          toast("⚠️ Ese documento ya está registrado.", "info", 5000);
        } else {
          toast("❌ Error guardando: " + msg, "error", 6000);
        }
        setStatus("Error");
      }
    });

    $("btnDelete").addEventListener("click", async () => {
      try{
        if (!state.user) {
          toast("⚠️ Debes iniciar sesión.", "info");
          return;
        }
        if (!state.allowed) {
          toast("⛔ Tu correo no está autorizado para eliminar.", "error");
          return;
        }
        if (!state.selectedId){
          toast("⚠️ Selecciona un miembro primero.", "info");
          return;
        }

        const nombre = `${$("first_names").value} ${$("last_names").value}`.trim();
        const ok = confirm(`¿Eliminar a "${nombre || "este miembro"}"? Esta acción no se puede deshacer.`);
        if (!ok) return;

        setStatus("Eliminando...");
        const { error } = await supabase
          .from("members")
          .delete()
          .eq("id", state.selectedId);

        if (error) throw error;

        state.memberDraft = blankMember();
        fillForm(state.memberDraft);
        setSelectedId(null);
        setStatus("Eliminado");
        toast("✅ Eliminado correctamente.", "success");
      } catch(e){
        toast("❌ Error eliminando: " + (e?.message || e), "error");
        setStatus("Error");
      }
    });

    // =========================
    // 7) PWA register
    // =========================
    if ("serviceWorker" in navigator){
      window.addEventListener("load", async () => {
        try{
          await navigator.serviceWorker.register("./sw.js");
        } catch(e){
          console.log("SW register error:", e);
        }
      });
    }

    // init
    fillForm(state.memberDraft);
    setSelectedId(null);
    setWriteEnabled(false);
    refreshSession();
  </script>
</body>
</html>
