<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />

  <!-- ✅ SOLO manifest.json (sin SW) -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">

  <title>IPUC · Miembros</title>

  <style>
    :root{
      --bg:#0b1020;--card:#121a33;--muted:#9aa4c0;--text:#e9ecf6;
      --accent:#4c7dff;--border:rgba(255,255,255,.08);--ok:#2dd4bf;--danger:#ff4c6a;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);
      background: var(--bg);
    }
    .header{position:sticky;top:0;background:#0b1020;border-bottom:1px solid var(--border);z-index:10}
    .header-inner{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:10px}
    .brand{font-weight:900}
    .container{max-width:1100px;margin:0 auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
    label{font-size:13px;color:var(--muted)}
    input,select,textarea,button{
      width:100%;padding:10px;border-radius:10px;
      border:1px solid var(--border);background:#0b1020;color:var(--text)
    }
    textarea{min-height:120px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .row1{display:grid;grid-template-columns:1fr;gap:12px}
    .btn{cursor:pointer;font-weight:700}
    .btn.primary{background:#4c7dff;border:none}
    .btn.danger{background:#ff4c6a;border:none}
    .btn:disabled{opacity:.5}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap}
    .badge{font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:999px}
    .suggestions{
      position:absolute;left:0;right:0;background:#0b1020;border:1px solid var(--border);
      border-radius:10px;max-height:250px;overflow:auto;display:none;z-index:20
    }
    .suggestions .item{padding:8px;border-top:1px solid var(--border);cursor:pointer}
    .suggestions .item:hover{background:#121a33}
    .toast{
      position:fixed;top:16px;left:50%;transform:translateX(-50%);
      background:#121a33;border:1px solid var(--border);
      border-radius:10px;padding:10px 14px;z-index:9999
    }
  </style>

  <!-- ✅ Supabase UMD correcto -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">IPUC · Miembros</div>
    <div>
      <span class="badge" id="authBadge">Sin sesión</span>
      <button class="btn" id="btnLogin">Iniciar sesión</button>
      <button class="btn danger" id="btnLogout" style="display:none">Cerrar</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="card">

    <div class="top-actions">
      <button class="btn" id="btnNew">Nuevo</button>
      <button class="btn primary" id="btnSave">Guardar</button>
      <button class="btn danger" id="btnDelete">Eliminar</button>
    </div>

    <hr>

    <div style="position:relative">
      <label>Buscar miembro</label>
      <input id="searchBox" placeholder="Nombre, apellido o documento">
      <div class="suggestions" id="suggestions"></div>
    </div>

    <hr>

    <div class="row">
      <div>
        <label>Nombres</label>
        <input id="first_names">
      </div>
      <div>
        <label>Apellidos</label>
        <input id="last_names">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Documento</label>
        <input id="identification">
      </div>
      <div>
        <label>Edad</label>
        <input id="age" type="number">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Género</label>
        <select id="gender">
          <option value="">--</option>
          <option>Masculino</option>
          <option>Femenino</option>
        </select>
      </div>
      <div>
        <label>Ciudad</label>
        <input id="city">
      </div>
    </div>

    <div class="row1">
      <label>Observaciones</label>
      <textarea id="observations"></textarea>
    </div>

  </div>
</div>

<script>
  const toast = (m) => {
    const t=document.createElement("div");
    t.className="toast"; t.textContent=m;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),3000);
  };

  const $ = (id)=>document.getElementById(id);

  // 🔑 Supabase
  const supabase = window.supabase.createClient(
    "https://ggznwqocjvfawjmbtzda.supabase.co",
    "sb_publishable_sXfYr31mrDcwkgPDY9pWsQ_C6x1yRhc"
  );

  let selectedId=null;
  let allowed=false;

  const blank=()=>({
    first_names:"",last_names:"",identification:"",
    age:null,gender:null,city:null,observations:null
  });

  let draft=blank();

  const fill=(m)=>{
    $("first_names").value=m.first_names||"";
    $("last_names").value=m.last_names||"";
    $("identification").value=m.identification||"";
    $("age").value=m.age||"";
    $("gender").value=m.gender||"";
    $("city").value=m.city||"";
    $("observations").value=m.observations||"";
  };

  const read=()=>({
    first_names:$("first_names").value.trim(),
    last_names:$("last_names").value.trim(),
    identification:$("identification").value.trim(),
    age:Number($("age").value)||null,
    gender:$("gender").value||null,
    city:$("city").value||null,
    observations:$("observations").value||null
  });

  // 🔐 AUTH
  async function refresh(){
    const {data}=await supabase.auth.getSession();
    const user=data.session?.user||null;
    $("authBadge").textContent=user?user.email:"Sin sesión";
    $("btnLogin").style.display=user?"none":"";
    $("btnLogout").style.display=user?"":"none";
    allowed=false;
    if(user){
      const {data:a}=await supabase.from("allowed_emails")
        .select("email").eq("email",user.email.toLowerCase()).maybeSingle();
      allowed=!!a;
      if(!allowed) toast("Solo lectura (no autorizado)");
    }
  }

  $("btnLogin").onclick=()=>supabase.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:location.origin+location.pathname}
  });

  $("btnLogout").onclick=async()=>{
    await supabase.auth.signOut();
    refresh();
  };

  supabase.auth.onAuthStateChange(refresh);
  refresh();

  // 🔎 SEARCH
  $("searchBox").oninput=async()=>{
    const q=$("searchBox").value.trim();
    if(q.length<2){$("suggestions").style.display="none";return;}
    const {data}=await supabase.from("members")
      .select("*")
      .or(`first_names.ilike.%${q}%,last_names.ilike.%${q}%,identification.ilike.%${q}%`)
      .limit(10);
    const box=$("suggestions"); box.innerHTML="";
    data.forEach(m=>{
      const d=document.createElement("div");
      d.className="item";
      d.textContent=`${m.first_names} ${m.last_names} (${m.identification})`;
      d.onmousedown=()=>{
        draft={...m}; selectedId=m.id; fill(draft);
        box.style.display="none";
      };
      box.appendChild(d);
    });
    box.style.display="block";
  };

  // 💾 CRUD
  $("btnNew").onclick=()=>{draft=blank();selectedId=null;fill(draft);};

  $("btnSave").onclick=async()=>{
    if(!allowed){toast("No autorizado");return;}
    const m=read();
    if(selectedId){
      await supabase.from("members").update(m).eq("id",selectedId);
      toast("Actualizado");
    }else{
      const {data}=await supabase.from("members").insert(m).select().single();
      selectedId=data.id;
      toast("Guardado");
    }
  };

  $("btnDelete").onclick=async()=>{
    if(!allowed||!selectedId)return;
    if(!confirm("¿Eliminar?"))return;
    await supabase.from("members").delete().eq("id",selectedId);
    draft=blank();selectedId=null;fill(draft);
    toast("Eliminado");
  };
</script>

</body>
</html>
